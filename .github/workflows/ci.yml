name: CI

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-node:
    name: Node.js Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run unit tests
      run: npm test

    - name: Run spec-based tests
      run: node test-spec.js

  cross-test-python:
    name: Cross-test vs Python (PyPI)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python NSV from PyPI
      run: pip install nsv

    - name: Run cross-tests against Python
      run: node cross-test-python.js

  cross-test-rust:
    name: Cross-test vs Rust (crates.io)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install NSV from crates.io
      run: cargo install nsv

    - name: Run cross-tests against Rust
      run: node cross-test-rust.js
